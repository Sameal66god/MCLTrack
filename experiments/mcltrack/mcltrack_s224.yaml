# ============================================================================
# MCLTrack-S224 - Small backbone with MCAL neck
# Model: Fast-iTPN-S (45M params, 19G FLOPs, 40fps @ 224x224)
# ============================================================================

DATA:
  MAX_SAMPLE_INTERVAL: 400
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  STD:
  - 0.229
  - 0.224
  - 0.225
  SAMPLER_MODE: "continuous"
  SEARCH:
    NUMBER: 4
    SIZE: 224
    FACTOR: 4.0
    CENTER_JITTER: 3.5
    SCALE_JITTER: 0.5
  TEMPLATE:
    NUMBER: 3
    SIZE: 112
    FACTOR: 2.0
    CENTER_JITTER: 0
    SCALE_JITTER: 0
  TRAIN:
    DATASETS_NAME:
    - LASOT
    - GOT10K_vottrain
    - COCO17
    - TRACKINGNET
    - VASTTRACK
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 60000

MODEL:
  ENCODER:
    TYPE: fastitpns
    STRIDE: 16
    PRETRAIN_TYPE: '/pretrained/fast_itpn_small_1600e_1k.pt'
    DROP_PATH: 0.1
    POS_TYPE: interpolate
    TOKEN_TYPE_INDICATE: True
    INTERACTION_INDEXES: [[6, 11], [11, 16], [16, 21],[21,26]]
    GRAD_CKPT: True

  NECK:
    TYPE: mcal
    D_MODEL: 384
    D_STATE: 16
    N_LAYERS: 4
    USE_LIQUID: True
    CELL_TYPE: 'cfc'
    USE_INPUT_DEPENDENT_TAU: True
    USE_MOTION_CROSS: False
    USE_TEMPORAL_ATTENTION: False
    USE_MULTISCALE_TEMPORAL: False
    USE_TEMPORAL_MEMORY: False

  DECODER:
    TYPE: CENTER
    NUM_CHANNELS: 256

  USE_TEMPLATE_QUEUE: False

TRAIN:
  LR: 0.0004
  WEIGHT_DECAY: 0.0001
  EPOCH: 300
  LR_DROP_EPOCH: 240
  BATCH_SIZE: 16
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  ENCODER_MULTIPLIER: 0.1
  FREEZE_ENCODER: False
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  CE_WEIGHT: 1.0
  PRINT_INTERVAL: 50
  GRAD_CLIP_NORM: 0.1
  FIX_BN: False
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  TYPE: normal
  TIME_CONSISTENCY_WEIGHT: 0.05
  SPATIO_TEMPORAL_WEIGHT: 0.0
  USE_TEMPORAL_AUG: False

TEST:
  EPOCH: 300
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  WINDOW: True
  NUM_TEMPLATES: 3

  DISAPPEAR_THRESHOLD: 0.15
  FULL_DISAPPEAR_THRESHOLD: 0.05
  DISAPPEAR_FRAMES: 3
  REAPPEAR_THRESHOLD: 0.3

  UPT:
    DEFAULT: 1
    LASOT: 0.8
    LASOT_EXTENSION_SUBSET: 0.85
    TRACKINGNET: 0.5
    TNL2K: 0.5
    NFS: 0.8
    UAV: 0.2
    VOT20: 0.4
    GOT10K_TEST: 0.5
  UPH:
    DEFAULT: 1
    LASOT: 0.88
    LASOT_EXTENSION_SUBSET: 0.97
    TRACKINGNET: 0.9
    TNL2K: 0.9
    NFS: 0.92
    UAV: 0.91
    VOT20: 0.94
    GOT10K_TEST: 0.9
  INTER:
    DEFAULT: 999999
    LASOT: 70
    LASOT_EXTENSION_SUBSET: 50
    TRACKINGNET: 20
    TNL2K: 20
    NFS: 90
    UAV: 1
    VOT20: 1
    GOT10K_TEST: 20
  MB:
    DEFAULT: 500
    LASOT: 500
    LASOT_EXTENSION_SUBSET: 500
    TRACKINGNET: 200
    TNL2K: 500
    NFS: 500
    UAV: 400
    VOT20: 500
    GOT10K_TEST: 500
