# ============================================================================
# MCLTrack-B224 - Base backbone with MCAL neck
# Core improvements:
# 1. CfC/Liquid temporal modeling on consecutive search features
# 2. Coordinate embedding (prev_bbox -> hidden state injection)
# 3. Teacher forcing with GT bbox during training
# 4. Time consistency loss for smooth predictions
# 5. Consecutive frame sampling for meaningful temporal modeling
# 6. Disappear-reappear mechanism for long-term tracking
# ============================================================================

DATA:
  MAX_SAMPLE_INTERVAL: 400
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  STD:
  - 0.229
  - 0.224
  - 0.225
  SAMPLER_MODE: "continuous"  # Strictly consecutive search frames
  SEARCH:
    NUMBER: 4  # 3 consecutive search frames for motion modeling
    SIZE: 224
    FACTOR: 4.0
    CENTER_JITTER: 3.5
    SCALE_JITTER: 0.5
  TEMPLATE:
    NUMBER: 3  # 3 templates for appearance adaptation
    SIZE: 112
    FACTOR: 2.0
    CENTER_JITTER: 0
    SCALE_JITTER: 0
  TRAIN:
    DATASETS_NAME:
    - LASOT
    - GOT10K_vottrain
    - COCO17
    - TRACKINGNET
    - VASTTRACK
    DATASETS_RATIO:
    - 1
    - 1
    - 1
    - 1
    - 1
    SAMPLE_PER_EPOCH: 60000

MODEL:
  ENCODER:
    TYPE: fastitpnb
    STRIDE: 16
    PRETRAIN_TYPE: '/pretrained/fast_itpn_base_clipl_e1600.pt'
    DROP_PATH: 0.1
    POS_TYPE: interpolate
    TOKEN_TYPE_INDICATE: True
    INTERACTION_INDEXES: [[8, 14], [14, 20], [20, 26],[26,32]]
    GRAD_CKPT: True

  NECK:
    TYPE: mcal
    D_MODEL: 512
    D_STATE: 16
    N_LAYERS: 4
    USE_LIQUID: True
    CELL_TYPE: 'cfc'
    USE_INPUT_DEPENDENT_TAU: True
    USE_MOTION_CROSS: False
    USE_TEMPORAL_ATTENTION: False
    USE_MULTISCALE_TEMPORAL: False
    USE_TEMPORAL_MEMORY: False

  DECODER:
    TYPE: CENTER
    NUM_CHANNELS: 256

  USE_TEMPLATE_QUEUE: False

TRAIN:
  LR: 0.0004
  WEIGHT_DECAY: 0.0001
  EPOCH: 300
  LR_DROP_EPOCH: 240
  BATCH_SIZE: 32
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  ENCODER_MULTIPLIER: 0.1
  FREEZE_ENCODER: False
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  CE_WEIGHT: 1.0
  PRINT_INTERVAL: 50
  GRAD_CLIP_NORM: 0.1
  FIX_BN: False
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  TYPE: normal
  TIME_CONSISTENCY_WEIGHT: 0.05
  SPATIO_TEMPORAL_WEIGHT: 0.0
  USE_TEMPORAL_AUG: False

TEST:
  EPOCH: 300
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 112
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 224
  WINDOW: True
  NUM_TEMPLATES: 3

  DISAPPEAR_THRESHOLD: 0.15
  FULL_DISAPPEAR_THRESHOLD: 0.05
  DISAPPEAR_FRAMES: 3
  REAPPEAR_THRESHOLD: 0.3

  UPT:
    DEFAULT: 1
    LASOT: 0.8
    LASOT_EXTENSION_SUBSET: 0.85
    TRACKINGNET: 0.5
    TNL2K: 0.5
    NFS: 0.8
    UAV: 0.2
    VOT20: 0.4
    GOT10K_TEST: 0.4
  UPH:
    DEFAULT: 1
    LASOT: 0.88
    LASOT_EXTENSION_SUBSET: 0.97
    TRACKINGNET: 0.9
    TNL2K: 0.9
    NFS: 0.92
    UAV: 0.91
    VOT20: 0.94
    GOT10K_TEST: 0.9
  INTER:
    DEFAULT: 999999
    LASOT: 70
    LASOT_EXTENSION_SUBSET: 50
    TRACKINGNET: 20
    TNL2K: 20
    NFS: 90
    UAV: 1
    VOT20: 1
    GOT10K_TEST: 20
  MB:
    DEFAULT: 500
    LASOT: 500
    LASOT_EXTENSION_SUBSET: 500
    TRACKINGNET: 200
    TNL2K: 500
    NFS: 500
    UAV: 400
    VOT20: 500
    GOT10K_TEST: 500
